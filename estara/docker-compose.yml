version: "3.9"

services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: estara_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: estara
      POSTGRES_PASSWORD: estara_dev_password
      POSTGRES_DB: estara
    ports:
      - "5432:5432"
    volumes:
      - estara_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U estara"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: estara_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - estara_redis_data:/data

  minio:
    image: minio/minio:latest
    container_name: estara_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: estara
      MINIO_ROOT_PASSWORD: estara_dev_password
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - estara_minio_data:/data

volumes:
  estara_pg_data:
  estara_redis_data:
  estara_minio_data:
